{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wellness Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <h2 class="text-2xl font-bold mb-4">Dashboard</h2>
    <p class="mb-4">Welcome to your wellness dashboard!</p>
    <div class="flex flex-wrap items-center gap-4 mb-8">
        <a href = "{%url 'daily-entry'%}" class="bg-indigo-600 text-white px-5 py-2 rounded-lg font-semibold hover:bg-indigo-700 shadow-sm transition">
            Add mood</a> <br>
        <a href = "{%url 'login_user'%}" class="bg-white text-gray-600 border border-gray-300 px-5 py-2 rounded-lg font-semibold hover:bg-gray-50 shadow-sm transition">
            Logout</a>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 h-[450px] flex flex-col">
            <h3 class="text-xl font-semibold text-gray-800 mb-4 flex items-center">
                <span class="mr-2">📈</span>Your Mood Overview</h3>
            <div class="flex-grow min-h-0 pb-6">
                <canvas id="moodChart"
                    data-dates='{{ dates|safe }}'
                    data-moods='{{ moods|safe }}'>
                </canvas>
            </div>
        </div>
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 h-[450px] flex flex-col">
            <h3 class="text-xl font-semibold text-gray-800 mb-4 flex items-center">
                <span class="mr-2">💤</span>Your Sleep Overview</h3>
            <div class="flex-grow min-h-0 pb-6">
                <canvas id="sleepChart"
                    data-dates='{{ dates|safe }}'
                    data-sleeps='{{ sleeps|safe }}'>
                </canvas>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{% static 'dashboard/dashboard.js' %}"></script>
</body>
</html>
